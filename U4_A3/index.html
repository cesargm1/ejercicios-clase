<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>UP4_A3 · Validación de formularios</title>
		<link rel="stylesheet" href="estilos.css" />
		<script src="app.js" defer></script>
	</head>
	<body>
		<h1>UP4_A3 · Alta en la plataforma</h1>

		<!-- Ejercicio 1: TODO añade type y los atributos de validación a cada campo -->
		<form id="registro" name="registro">
			<div class="campo">
				<label for="nombre">Nombre*</label>
				<input id="nombre" name="nombre" type="text" autocomplete="name" />
				<span class="feedback" aria-live="polite"></span>
			</div>

			<div class="campo">
				<label for="email">Correo electrónico*</label>
				<input id="email" name="email" type="email" autocomplete="email" />
				<span class="feedback" aria-live="polite"></span>
			</div>

			<div class="campo">
				<label for="edad">Edad*</label>
				<input id="edad" name="edad" type="number" />
				<span class="feedback" aria-live="polite"></span>
			</div>

			<div class="campo">
				<label for="password">Contraseña*</label>
				<input
					id="password"
					name="password"
					type="password"
					autocomplete="new-password"
				/>
				<span class="feedback" aria-live="polite"></span>
			</div>

			<div class="campo">
				<label for="password2">Repite la contraseña*</label>
				<input
					id="password2"
					name="password2"
					type="password"
					autocomplete="new-password"
				/>
				<span class="feedback" aria-live="polite"></span>
			</div>

			<div class="botones">
				<button type="submit">Enviar</button>
				<button type="reset">Reiniciar</button>
			</div>
		</form>

		<p id="confirmacion" hidden></p>
	</body>
</html>
